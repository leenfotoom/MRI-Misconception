services:
  postgres:
    image: postgres:17-alpine
    container_name: misconception-mri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: misconception_mri
      POSTGRES_USER: misconception
      POSTGRES_PASSWORD: misconception
    ports:
      - "55432:5432"
    volumes:
      - misconception_mri_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misconception -d misconception_mri"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  misconception_mri_pgdata:
